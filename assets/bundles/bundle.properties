# ═══════════════════════════════════════════════════════
#  Industry Mod — bundle.properties (ES)
# ═══════════════════════════════════════════════════════

# ── MÓDULO 1: METALURGIA ────────────────────────────────
block.ore-grinder.name = Trituradora Industrial
block.ore-grinder.description = Tritura mineral bruto en polvo fino para fundición. Admite cobre, plomo y mineral de hierro.

block.arc-furnace.name = Horno de Arco
block.arc-furnace.description = Funde polvo de mineral mediante un arco eléctrico de alta tensión. Produce metal fundido.

block.casting-mold.name = Lingotería
block.casting-mold.description = Vierte metal fundido en moldes para producir lingotes sólidos de acero.

block.rolling-mill.name = Laminador
block.rolling-mill.description = Lamina lingotes de acero en planchas y perfiles estructurales de uso industrial.

block.alloy-forge.name = Forja de Aleaciones
block.alloy-forge.description = Combina metales a alta presión y temperatura para crear aleaciones de alta resistencia.

# ── MÓDULO 2: QUÍMICA BÁSICA & GASES ─────────────────────
block.chemical-reactor.name = Reactor Químico
block.chemical-reactor.description = Combina arena y agua en presencia de catalizadores para sintetizar ácido sulfúrico.

block.distillation.name = Destiladora Industrial
block.distillation.description = Separa mezclas por punto de ebullición. Produce nitrógeno líquido a partir de ácido sulfúrico.

block.polymer-extruder.name = Extrusor de Polímeros
block.polymer-extruder.description = Convierte resina polimérica líquida en gránulos sólidos de polímero.

block.gas-synthesizer.name = Sintetizador de Gases
block.gas-synthesizer.description = Electroliza agua para producir oxígeno y nitrógeno comprimidos en cápsulas industriales.

# ── MÓDULO 3: PETROQUÍMICA & REFINERÍA ───────────────────
block.oil-derrick.name = Torre Petrolífera
block.oil-derrick.description = Perfora y bombea crudo pesado desde bolsas petrolíferas subterráneas.

block.fractional-tower.name = Torre de Fraccionamiento
block.fractional-tower.description = Columna de destilación atmosférica de petróleo. Separa el crudo en nafta ligera y residuo de asfalto.

block.catalytic-cracker.name = Craqueador Catalítico
block.catalytic-cracker.description = Descompone fracciones medias de hidrocarburos mediante craqueo térmico para obtener gas de petróleo.

block.lubricant-synthesizer.name = Sintetizador de Lubricante
block.lubricant-synthesizer.description = Refina crudo en aceites lubricantes sintéticos para reducir el desgaste en maquinaria.

block.vulcanizer.name = Vulcanizadora
block.vulcanizer.description = Procesa nafta con carbón y calor para sintetizar caucho vulcanizado de alta durabilidad.

block.carbon-fiber-loom.name = Telar de Fibra de Carbono
block.carbon-fiber-loom.description = Sintetiza hebras de carbono de ultra-alta resistencia a partir de polímeros y gas presurizado.

# ── MÓDULO 4: MINERÍA ───────────────────────────────────
block.deep-drill.name = Taladro Profundo
block.deep-drill.description = Perfora hasta capas profundas del subsuelo para extraer minerales de alta dureza.

block.explosive-charger.name = Cargador de Explosivos
block.explosive-charger.description = Ensambla cargas explosivas industriales para operaciones de voladura masiva.

block.blast-miner.name = Minador por Voladura
block.blast-miner.description = Detona cargas en el subsuelo y extrae mezcla de mineral triturado en masa.

block.magnetic-separator.name = Separador Magnético
block.magnetic-separator.description = Separa la mezcla mineral por campos electromagnéticos en hierro, cobre, plomo y titanio.

# ── MÓDULO 5: AUTOMATIZACIÓN ────────────────────────────
block.industrial-conveyor.name = Cinta Industrial
block.industrial-conveyor.description = Cinta transportadora de alta velocidad para transporte masivo de materiales.

block.item-sorter.name = Clasificador de Ítems
block.item-sorter.description = Clasifica y desvía ítems según el filtro configurado.

block.distribution-router.name = Router de Distribución
block.distribution-router.description = Distribuye equitativamente el flujo de materiales entre todas sus salidas.

block.assembly-station.name = Estación de Ensamblaje
block.assembly-station.description = Brazos robóticos que ensamblan planchas, polímeros y circuitos en piezas mecánicas de precisión.

block.mechanical-press.name = Prensa Mecánica
block.mechanical-press.description = Estampa piezas mecánicas y aleaciones bajo toneladas de presión para crear chips de control.

# ── MÓDULO 6: FLUIDOS & LOGÍSTICA ────────────────────────
block.industrial-warehouse.name = Almacén Industrial
block.industrial-warehouse.description = Almacén masivo de alta capacidad (5000 ítems) para reservas logísticas.

block.distribution-hub.name = Centro de Distribución
block.distribution-hub.description = Nodo central de logística de alta transferencia para balancear múltiples líneas.

block.industrial-pipe.name = Tubería Industrial Blindada
block.industrial-pipe.description = Tubería de alta presión capaz de transportar ácidos concentrados y crudo pesado sin fugas.

block.heavy-liquid-tank.name = Tanque Pesado de Hidrocarburos
block.heavy-liquid-tank.description = Depósito reforzado con 4500L de capacidad para almacenar hidrocarburos y reactivos químicos.

# ── MÓDULO 7: CONTROL INDUSTRIAL ─────────────────────────
block.industrial-plc.name = PLC Industrial
block.industrial-plc.description = Controlador lógico programable con mayor rango y velocidad de ejecución de código.

block.flow-sensor.name = Sensor de Flujo
block.flow-sensor.description = Mide el flujo en tiempo real para activar la lógica industrial.

block.production-dashboard.name = Panel de Producción
block.production-dashboard.description = Consola de supervisión centralizada para monitorizar fábricas completas.

